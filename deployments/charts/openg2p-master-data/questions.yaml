# ── Country pack ────────────────────────────────────────────────────────────
# This is the ONE place a deployment declares which country it serves. Registries
# read the geography, datasets and sample people from here; none of them names
# a country of its own, so these are the only country settings in the platform.
- variable: geoSeed.enabled
  description: Seed the geography and datasets from a country pack after install. Runs as a post-install Job and is idempotent, so it re-runs safely on upgrade.
  type: boolean
  default: true
  label: Enable Country Pack Seeding
  group: Country Pack

- variable: geoSeed.countryPack
  description: "Which country this environment serves, as the pack directory name (alpha-3). ETH is Ethiopia from OCHA COD-AB — country > region > zone > woreda, 1271 units, CC BY-IGO with attribution required. XKM is Kamuntu, a fictitious country for demos and tests, whose P-codes come from the ISO 3166 user-assigned ranges and cannot collide with a real country's."
  type: enum
  options:
    - XKM
    - ETH
  default: XKM
  label: Country Pack
  group: Country Pack

- variable: geoSeed.load.geo
  description: Load the administrative hierarchy, P-codes and boundary geometry. This is what registry records and every map join against.
  type: boolean
  default: true
  label: Load Geography
  group: Country Pack

- variable: geoSeed.load.codelists
  description: Load the country's core datasets (gender, education level, water source, ...) with their semantic role tags. Registries copy these into their own tables at install; without this they fall back to the values their extension ships. Role tags have no other source.
  type: boolean
  default: true
  label: Load Datasets
  group: Country Pack

- variable: geoSeed.load.samples
  description: Load the pack's sample people — a couple of dozen, coherent with the geography and the datasets. For a demo or a fresh install that would otherwise show an empty registry. Not bulk analytics data, which each registry generates itself.
  type: boolean
  default: true
  label: Load Sample People
  group: Country Pack

- variable: geoSeed.domains
  description: "Dataset themes (sector datasets) to load alongside the core datasets, comma-separated. Use 'agriculture' for a Farmer Registry (crops, livestock); leave empty for a social registry, which has no use for them."
  type: string
  default: ""
  label: Dataset Themes
  group: Country Pack

# ── Public catalogue ────────────────────────────────────────────────────────
# Opt-in. Master Data stays an admin UI; this only opens a read-only API for
# other websites and open-data portals. Even when enabled, only datasets and
# geography marked "public" in Master Data are served (published versions only).
- variable: masterDataAPI.catalogue.public.enabled
  description: "Serve the anonymous, read-only public catalogue under /public/ (DCAT JSON-LD at /public/catalog, SKOS per dataset, CSV / JSON / GeoJSON downloads). Off: every /public route answers 404. Only datasets and geography marked public in Master Data are shown, at their published versions."
  type: boolean
  default: false
  label: Enable Public Catalogue
  group: Public catalogue
  show_subquestion_if: true
  subquestions:
    - variable: masterDataAPI.catalogue.public.istio.enabled
      description: "Route a separate host to the public catalogue (only /public/ is reachable on it)."
      type: boolean
      default: false
      label: Public Catalogue Host
    - variable: masterDataAPI.catalogue.public.istio.host
      description: "Hostname of the public catalogue."
      type: string
      default: 'catalogue.{{ .Release.Namespace }}.openg2p.org'
      label: Public Catalogue Hostname
    - variable: masterDataAPI.catalogue.public.istio.gateway
      description: "Istio gateway for the public host. The default 'internal' gateway is reachable on the internal network only; exposing the catalogue to the internet needs a public (internet-facing) gateway."
      type: string
      default: internal
      label: Public Catalogue Gateway
    - variable: masterDataAPI.catalogue.public.baseUrl
      description: "Absolute base URL used in DCAT / SKOS links and download URLs, e.g. https://catalogue.example.gov. Empty: taken from each request (the public host sets it)."
      type: string
      default: ""
      label: Public Base URL
    - variable: masterDataAPI.catalogue.public.rateLimitPerMinute
      description: "Requests per minute per client IP (per API worker); 0 disables. Over the limit: HTTP 429."
      type: int
      default: 60
      label: Rate Limit (per minute)
    - variable: masterDataAPI.catalogue.public.publisher
      description: "Publisher named in the DCAT catalogue. Empty: the catalogue's default owner."
      type: string
      default: ""
      label: Catalogue Publisher
