{{- if .Values.dbSeed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-seed
  labels:
    app.kubernetes.io/name: db-seed
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-seed
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        # 1. Wait for PostgreSQL to be reachable
        - name: wait-for-db
          image: jbergknoff/postgresql-client:latest
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c']
          args:
            - >-
              until pg_isready
              -h {{ .Values.global.postgresqlHost }}
              -p {{ .Values.global.masterDataDBPort | default 5432 }}
              -d {{ include "common.tplvalues.render" (dict "value" .Values.global.masterDataDB "context" $) }};
              do echo "Waiting for DB..."; sleep 3;
              done
        # 2. Wait for the master-data API to be ready (tables are created by its
        #    `migrate` on startup and must exist before seeding).
        - name: wait-for-api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for master-data-api to be ready..."
              until wget -qO- --timeout=5 http://{{ .Release.Name }}-master-data-api:{{ .Values.masterDataAPI.service.port | default 80 }}/ping >/dev/null 2>&1; do
                echo "  waiting for master-data-api..."; sleep 5
              done
              echo "  master-data-api is ready."
      containers:
        - name: db-seed
          image: {{ include "common.tplvalues.render" (dict "value" .Values.dbSeed.image.repository "context" $) }}:{{ .Values.dbSeed.image.tag }}
          imagePullPolicy: {{ .Values.dbSeed.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ .Values.global.postgresqlHost | quote }}
            - name: PGPORT
              value: {{ .Values.global.masterDataDBPort | default 5432 | quote }}
            - name: PGDATABASE
              value: {{ include "common.tplvalues.render" (dict "value" .Values.global.masterDataDB "context" $) | quote }}
            - name: PGUSER
              value: {{ include "common.tplvalues.render" (dict "value" .Values.global.masterDataDBUser "context" $) | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "common.tplvalues.render" (dict "value" .Values.global.masterDataDBSecret "context" $) | quote }}
                  key: {{ include "common.tplvalues.render" (dict "value" .Values.global.masterDataDBUserPasswordKey "context" $) | quote }}
            - name: LOAD_GEO_DATA
              value: {{ .Values.dbSeed.loadGeoData | quote }}
          {{- if .Values.dbSeed.resources }}
          resources: {{- include "common.tplvalues.render" (dict "value" .Values.dbSeed.resources "context" $) | nindent 12 }}
          {{- end }}
{{- end }}
