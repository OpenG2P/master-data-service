{{- /*
HMAC secret AWE signs its catalogue callbacks with (approval mode "awe").

Same semantics as the registry chart's awe-callback-hmac-secret.yaml: a random
value minted once, before install/upgrade, kept across reinstalls and
lookup-guarded so it stays stable — the callback_secret row the geo-seed Job
registers in AWE and the master-data-api verifier must agree on it.
*/ -}}
{{- $cat := .Values.masterDataAPI.catalogue }}
{{- if eq $cat.approvalMode "awe" }}
{{- $name := tpl $cat.awe.hmacSecretName $ }}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $cat.awe.hmacSecretKey | quote }}: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
{{- end }}
