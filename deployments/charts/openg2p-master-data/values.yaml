global:
  masterDataHostname: 'master-data.{{ .Release.Namespace }}.openg2p.org'
  masterDataUiHostname: 'master-data-ui.{{ .Release.Namespace }}.openg2p.org'
  # Database
  postgresqlHost: commons-postgresql
  # Underscores to follow postgresql conventions
  # The complicated logic below is just to ensure that when chart is installed
  # as master-data, we don't want the database to be called master_data_master_data
  masterDataDB:  '{{ if eq .Release.Name "master-data" }}master_data{{ else }}{{ printf "%s_master_data" .Release.Name | replace "-" "_" }}{{ end }}'
  masterDataDBPort: 5432
  masterDataDBUser: '{{ if eq .Release.Name "master-data" }}master_data_user{{ else }}{{ printf "%s_master_data_user" .Release.Name | replace "-" "_" }}{{ end }}'
  masterDataDBSecret: '{{ if eq .Release.Name "master-data" }}master-data{{ else }}{{ .Release.Name }}-master-data{{ end }}'
  masterDataDBUserPasswordKey: '{{ if eq .Release.Name "master-data" }}master-data-db-user{{ else }}{{ .Release.Name }}-master-data-db-user{{ end }}'

  # IAM (JWT validation + DP_ role -> permission resolution). Consumed by
  # master-data Settings (MASTER_DATA_API_*); override per environment.
  # Must match the Keycloak client / staff-portal application mnemonic
  # (master-data) that carries MASTER_DATA_ADMIN for CRUD.
  authClientId: master-data
  # K8s Secret holding the OIDC client password (same name as clientId when
  # provisioned by keycloak-init). Used by the iam-register Job for
  # client_credentials against Keycloak.
  authClientSecret: master-data
  authClientSecretKey: client_secret
  keycloakBaseUrl: 'https://keycloak.{{ .Release.Namespace }}.openg2p.org'
  keycloakRealm: staff
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'
  # Internal IAM staff-portal-api URL (self-registration + permission resolution).
  iamServiceUrl: 'http://commons-services-iam-staff-portal-api'
  authProviderApiUrl: '{{ tpl .Values.global.iamServiceUrl $ }}'
  # Same Redis as IAM staff-portal-api (refresh-token store).
  redisInstallationName: 'commons-redis'
  # Double-submit CSRF on state-changing master-data-api requests.
  csrfEnabled: true

postgres-init:
  enabled: true
  postgresql:
    host: '{{ tpl .Values.global.postgresqlHost $ }}'
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.masterDataDB $ }}'
      user: '{{ tpl .Values.global.masterDataDBUser $ }}'
      secret: '{{ tpl .Values.global.masterDataDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'
      extensions:
        - 'pg_trgm'

# ---------------------------------------------------------------------------
# keycloak-init — provisions the master-data OIDC client + MASTER_DATA_ADMIN
# role in the shared `staff` realm (same pattern as AWE / registry).
#
# Creates:
#   * confidential client `global.authClientId` (default: master-data) with
#     service accounts enabled (needed by iam-register client_credentials)
#   * client role MASTER_DATA_ADMIN
#   * K8s Secret named after the clientId with key `client_secret`
#   * maps MASTER_DATA_ADMIN onto the commons-provisioned `admin` user
# ---------------------------------------------------------------------------
keycloak-init:
  enabled: true
  keycloak:
    url: 'http://commons-keycloak:80'
    user: 'admin'
    password: ''
    existingSecret: 'commons-keycloak'
    existingSecretKey: 'admin-password'
  suffix: '{{ .Release.Namespace }}'
  realms:
    staff:
      clients:
        - clientId: '{{ tpl .Values.global.authClientId $ }}'
          name: OpenG2P Master Data
          redirectUris:
            - 'https://{{ tpl .Values.global.masterDataHostname $ }}/*'
          clientRoles:
            - "MASTER_DATA_ADMIN"
      users:
        # Assumes `admin` already exists from the commons layer.
        - username: admin
          clientRoleMappings:
            '{{ tpl .Values.global.authClientId $ }}':
              - "MASTER_DATA_ADMIN"

# ---------------------------------------------------------------------------
# IAM registration — self-registers this master-data release into the IAM
# staff portal (same pattern as registry-platform/.../files/iam-registration).
# Post-install/post-upgrade hook Job pushes files/iam-registration/payload.json
# (permissions + MASTER_DATA_ADMIN role mapping) to IAM. application_mnemonic
# is global.authClientId; application_url is https://<masterDataHostname>.
# Runs after keycloak-init so the client_secret Secret exists.
# ---------------------------------------------------------------------------
iamRegister:
  enabled: true
  applicationDescription: "OpenG2P Master Data"
  image:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent
  backoffLimit: 5
  tokenMaxAttempts: 30
  registerMaxAttempts: 10
  ttlSecondsAfterFinished: 600
  # Commons/Rancher skips Helm hooks — override these to null there so the Job
  # runs as a regular resource. Standalone installs keep post-install hooks.
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
  payloadAnnotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "19"
    "helm.sh/hook-delete-policy": before-hook-creation
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

masterDataAPI:
  enabled: true
  nameOverride: master-data-api
  hostname: '{{ tpl .Values.global.masterDataHostname $ }}'

  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: registry.gitlab.com/openg2p/master-data-service/master-data-api
    tag: "develop"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ .Release.Name }}-master-data-api'
      destinationPort: '{{ .Values.masterDataAPI.service.port }}'
      prefix: '{{ .Values.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  envVars:
    MASTER_DATA_API_DB_HOSTNAME: '{{ tpl .Values.global.postgresqlHost $ }}'
    MASTER_DATA_API_DB_DBNAME: '{{ tpl .Values.global.masterDataDB $ }}'
    MASTER_DATA_API_DB_PORT: '{{ .Values.global.masterDataDBPort }}'
    MASTER_DATA_API_DB_USERNAME: '{{ tpl .Values.global.masterDataDBUser $ }}'
    MASTER_DATA_API_PORT: '{{ .Values.containerPort }}'
    MASTER_DATA_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'
    # Auth / CSRF (iam-core fields inherited on master-data Settings).
    MASTER_DATA_API_KEYCLOAK_CLIENT_ID: '{{ tpl .Values.global.authClientId $ }}'
    MASTER_DATA_API_AUTH_PROVIDER_API_URL: '{{ tpl .Values.global.authProviderApiUrl $ }}'
    MASTER_DATA_API_AUTH_REDIS_URL: 'redis://{{ tpl .Values.global.redisInstallationName $ }}-master:6379/0'
    MASTER_DATA_API_CSRF_ENABLED: '{{ .Values.global.csrfEnabled }}'

  envVarsFrom:
    MASTER_DATA_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'


  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    # Wait until the DB accepts OUR CREDENTIALS, not merely until the server is
    # up. pg_isready only pings the postmaster — it succeeds even when the app's
    # role/password does not exist yet. postgres-init creates and syncs that role
    # in parallel with this Deployment, so a bare pg_isready let the API start
    # too early: its startup migration then died with
    # `InvalidPasswordError: password authentication failed`, the error was
    # swallowed, gunicorn came up anyway, and the schema was NEVER created
    # (the migration is not retried). Everything downstream that needs the
    # schema — e.g. the geo-seed hook Job — then failed, taking the whole Helm
    # release with it, while the API pod looked healthy.
    - 'until PGPASSWORD="${MASTER_DATA_API_DB_PASSWORD}" psql -q -U "${MASTER_DATA_API_DB_USERNAME}" -h "${MASTER_DATA_API_DB_HOSTNAME}" -p "${MASTER_DATA_API_DB_PORT:-5432}" -d "${MASTER_DATA_API_DB_DBNAME:-masterDatadb}" -c "SELECT 1" >/dev/null 2>&1; do echo "waiting for postgres credentials to work..."; sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

masterDataUi:
  enabled: true
  nameOverride: master-data-ui
  hostname: '{{ tpl .Values.global.masterDataUiHostname $ }}'

  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: registry.gitlab.com/openg2p/master-data-service/master-data-ui
    tag: "develop"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  containerPort: 3000

  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 768Mi

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ .Release.Name }}-master-data-ui'
      destinationPort: '{{ .Values.masterDataUi.service.port }}'
      prefix: '/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  # Browser-facing IAM URL (Master Data UI login providers)
  iamPublicUrl: 'https://staff-iam.{{ .Release.Namespace }}.openg2p.org'

  envVars:
    BACKEND_URL: 'http://commons-services-master-data-api'
    DEFAULT_LOCALE: "en"
    IAM_URL: '{{ tpl .Values.iamPublicUrl $ }}'
    LOGIN_PROVIDER_ID: "1"
    APPLICATION_MNEMONIC: "master-data"
    COOKIE_DOMAIN: '.{{ .Release.Namespace }}.openg2p.org'
    NODE_ENV: production

  envVarsFrom: {}

  startupProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

# ── Geo seeding ──────────────────────────────────────────────────────────────
# MDS owns geography and seeds its own at install. `countryPack` is the single
# place a deployment declares which country it serves — one Master Data Service
# per environment means one geography, and a registry chart must never declare
# a country of its own or the two can disagree.
#
# A pack carries the administrative hierarchy, P-codes and simplified boundary
# geometry. All packs live in openg2p-data/packs and are baked into the db-seed
# image; see that directory's README for the contract they satisfy.
geoSeed:
  enabled: true
  # Directory of packs inside the image, then the pack to load.
  packRoot: /openg2p-data/packs
  # ETH is Ethiopia, from OCHA COD-AB via HDX: country > region > zone > woreda,
  # 1271 units. It carries a LICENCE OBLIGATION — CC BY-IGO, attribution
  # required — recorded in the pack's manifest.json and printed at seed time.
  # The boundaries are operational, not a statement on legal or political status.
  #
  # XKM is Kamuntu, a fictitious country with invented boundaries and P-codes
  # drawn from the ISO 3166 user-assigned ranges, so they can never collide with
  # a real country's. Use it for demos and tests where attaching invented
  # poverty and enrolment figures to a real country's name would be misleading.
  #
  # Any other directory under openg2p-data/packs works the same way.
  #
  # Defaults to XKM so an install nobody configured cannot attach invented
  # poverty and enrolment figures to a real country's name, and picks up no
  # licence obligation by accident. Deployments choose the real country — the
  # commons-services umbrella sets it, and it is surfaced in that chart's form.
  countryPack: XKM

  # Which sections of the pack to load.
  #
  # All three on: registries read code lists from the Master Data API, and the
  # sample people stop a fresh install showing an empty registry.
  load:
    geo: true
    codelists: true
    # The pack's sample people — a couple of dozen, country-coherent, for a demo
    # or a fresh install that would otherwise show an empty registry. Registries
    # read these and add their own fields. Not bulk analytics data, which needs
    # no country-coherent names and is generated per registry.
    samples: true
  # Domain subtrees to load alongside the code lists, e.g. [agriculture] for a
  # Farmer Registry. Empty loads the core lists only — a social registry has no
  # use for crop types.
  domains: []
  image:
    # Same registry and tag convention as masterDataAPI above; CI rewrites the
    # tag via CHART_IMAGE_PATHS in .gitlab-ci.yml.
    repository: registry.gitlab.com/openg2p/master-data-service/master-data-db-seed
    tag: "develop"
  waitImage: jbergknoff/postgresql-client:latest
  backoffLimit: 2
  # Optional MinIO settings kept for pack assets; the geo loader stores only
  # the hierarchy (level / value mnemonics), not boundary URIs.
  objectStore:
    endpoint: http://commons-minio:9000
    bucket: openg2p-geo
    # Browser-reachable base URL, when it differs from the in-cluster endpoint.
    publicBaseUrl: ""
    existingSecret: commons-minio
    accessKeyKey: root-user
    secretKeyKey: root-password
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 1Gi
