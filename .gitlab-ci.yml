# master-data-service — build & publish on GitLab.
#
# Generated by openg2p/packaging ci/migrate/github-to-gitlab.sh, translated
# from this repo's GitHub caller. All versioning/build/publish logic lives
# centrally in openg2p/packaging@v1; this file only declares what THIS repo has.
#
#   images -> registry.gitlab.com/openg2p/platform-services/master-data-service/<name>   (this project)
#   chart  -> openg2p/charts Helm registry                (shared catalogue)

include:
  - project: 'openg2p/packaging'
    ref: v1
    file: '/ci/gitlab/build-publish.yml'

variables:
  PACKAGING_REF: v1

  IMAGES: |
    [
      {
        "name": "master-data-api",
        "dockerfile": "docker/master-data-api/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          },
          {
            "arg": "IAM_SERVICE_REF",
            "repo": "https://gitlab.com/openg2p/platform-services/iam",
            "ref": "1.4"
          }
        ]
      },
      {
        "name": "master-data-db-seed",
        "dockerfile": "docker/db-seed/Dockerfile",
        "pins": [
          {
            "arg": "OPENG2P_DATA_BRANCH",
            "repo": "https://github.com/openg2p/openg2p-data",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "master-data-ui",
        "dockerfile": "docker/master-data-ui/Dockerfile",
        "context": "master-data-ui"
      }
    ]

  CHART_PATH: deployments/charts/openg2p-master-data
  CHART_IMAGE_PATHS: '[".masterDataAPI.image.tag", ".geoSeed.image.tag", ".masterDataUi.image.tag"]'
  CHART_GITLAB_PROJECT: openg2p/charts
