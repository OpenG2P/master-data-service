[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openg2p-gen2-master-data"
authors = [
  { name="OpenG2P", email="info@openg2p.org" },
]
description = "OpenG2P Gen 2 Master Data"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
]
dependencies = [
  "openg2p-fastapi-common >=1.1.4",
  "iam-core",
  # Declared here, not left to fastapi-common (which asks only for >=2.0.20):
  # SQLAlchemy 2.1 made greenlet optional, so an unpinned resolve pulled 2.1
  # without it and the API died at import ("requires the greenlet library").
  # [asyncio] brings greenlet; <2.1 keeps us on the tested line, as
  # registry-platform does.
  "sqlalchemy[asyncio] >=2.0,<2.1",
  "asyncpg",
  "psycopg2",
  "fastapi-cache2",
  "jinja2"
  ]
dynamic = ["version"]

[project.urls]
Homepage = "https://openg2p.org"
Documentation = "https://docs.openg2p.org/"
Repository = "https://github.com/OpenG2P/openg2p-gen2-master-data"
Source = "https://github.com/OpenG2P/openg2p-gen2-master-data"

[tool.hatch.version]
path = "src/openg2p_gen2_master_data/__init__.py"
